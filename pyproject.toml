[project]
name = "navic-nma"
version = "0.1.0"
description = "Simulated NavIC-style receiver with dual TESLA authentication, Roughtime-style signed time and replay detection"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.2",
  "numpy==2.5.4",
  "matplotlib==3.11.2",
  "pyyaml==6.0.3",
]
[project.optional-dependencies]
test = ["pytest==9.2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
